<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NagMeister — race results</title>
<meta name="description" content="Historic racing form, odds movement and value — one table.">

<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="alternate icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#199063">

<meta property="og:title" content="NagMeister">
<meta property="og:description" content="Historic racing form, odds movement and value — one table.">
<meta property="og:image" content="/static/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/static/og-image.png">

<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <a class="brand" href="/" title="NagMeister">
    <img src="/static/logo-mark.svg" alt="" width="38" height="38">
    <span class="wordmark">Nag<span>Meister</span></span>
  </a>
  <div id="stats" class="stats">loading…</div>

  <div class="find">
    <input id="q" type="search" placeholder="Find in table…" autocomplete="off" spellcheck="false">
    <button id="prev" title="Previous match (Shift+Enter)" disabled>&uarr;</button>
    <button id="next" title="Next match (Enter)" disabled>&darr;</button>
    <span id="matchinfo" class="matchinfo"></span>
    <button id="clear" class="ghost" title="Clear filters and search">Reset</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<div class="tablewrap">
  <table id="grid">
    <thead>
      <tr id="headrow"></tr>
      <tr id="filterrow"></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No rows match these filters.</div>
</div>

<footer>
  <button id="first">&laquo; First</button>
  <button id="pprev">&lsaquo; Prev</button>
  <span id="pageinfo">—</span>
  <button id="pnext">Next &rsaquo;</button>
  <button id="last">Last &raquo;</button>
  <label class="pagesize">Rows
    <select id="limit">
      <option>50</option><option selected>100</option><option>250</option><option>500</option>
    </select>
  </label>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
