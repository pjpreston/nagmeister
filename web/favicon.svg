  <path d="M24 47c2 5 5 7 8 7s6-2 8-7z" fill="#7E3A30" stroke="#4A2F18" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M27 47h10v4c0 2-1 3-3 3h-4c-2 0-3-1-3-3z" fill="#fff"/>
