    <path d="M46 20c4-4 5-11 3-15-1-3-5-3-6 0-2 4-1 11 3 15z" fill="#C9873F"/>
    <path d="M32 10c11 0 18 7 18 18 0 5-1 8-2 12-1 4-2 7-2 11 0 7-6 11-14 11s-14-4-14-11c0-4-1-7-2-11-1-4-2-7-2-12 0-11 7-18 18-18z" fill="#C9873F"/>
    <ellipse cx="32" cy="45" rx="13" ry="10" fill="#F7E6D0"/>
  </g>
  <path d="M17 22c0-9 7-15 15-15s15 6 15 15c-3-5-7-6-10-3-2-4-4-6-6-6s-4 2-6 6c-3-3-7-2-8 3z" fill="#4A2F18"/>
